name: WAF live API verification
on:
  pull_request:
    paths:
      - '.github/workflows/live-verification.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify public Verbindo API contract
        shell: bash
        run: |
          set -euo pipefail
          curl --silent --show-error --fail --connect-timeout 15 --max-time 90 --retry 1 --retry-max-time 100 --max-filesize 65536 -D headers.txt -o response.json -w 'HTTP %{http_code}; seconds %{time_total}\n' https://open-data-coach.onrender.com/api/waf/status
          grep -iE '^content-type: application/json([;[:space:]]|$)' headers.txt >/dev/null
          python3 - <<'PY'
          import json
          with open('response.json') as f:
              data = json.load(f)
          assert isinstance(data, dict) and data, 'Expected nonempty JSON object'
          assert data.get('schemaVersion') == 1, 'Unexpected schema version'
          assert data.get('factoryVersion') == '0.3.0', 'Unexpected factory version'
          assert data.get('app') == 'verbindo', 'Unexpected app'
          assert data.get('appVersion') == '9.0.0', 'Unexpected deployed app version'
          assert data.get('commit') == '3fc2676fa560d71e817dfc3e2072d0391cfa573f', 'Unexpected deployed commit'
          assert data.get('releaseVerified') is True, 'Missing release metadata'
          blocks = data.get('blocks')
          assert isinstance(blocks, dict) and set(blocks) == {'auth','data','theme','api','quality','release','ux-design'}, 'Unexpected block set'
          for name, block in blocks.items():
              assert isinstance(block, dict) and block.get('version') == '0.1.0', f'Unexpected block version: {name}'
          print('Versioned status contract and deployment identity verified; authenticated journeys remain separate.')
          PY

      - name: Reject unauthenticated owner and maintenance access
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          base=https://open-data-coach.onrender.com
          for route in /api/owner/usage /api/mail/status; do
            for auth in none malformed; do
              headers=()
              if [[ "$auth" == malformed ]]; then headers=(-H 'Authorization: Bearer invalid.test.token'); fi
              code=$(curl --silent --show-error --connect-timeout 10 --max-time 25 --head -o /dev/null -w '%{http_code}' "${headers[@]}" "$base$route")
              printf '%s %s: %s\n' "$route" "$auth" "$code"
              case "$code" in 401|403) ;; *) echo 'Expected authorization denial'; exit 1;; esac
            done
          done
